# Build, check and release all four versions of Retro Pocket:
# Windows (x86_64), Linux (x86_64), macOS Apple Silicon (arm64), macOS Intel (x86_64).
#
# On every push, pull request and Monday (to catch changes in the emulators
# and GitHub's machines), each version is:
#   1. set up from source with its system's own setup script, and unit-tested;
#   2. built, with its version from git: 1.2.0 on a release, 1.2.0-3-gabc1234
#      three commits later (tools/build_*.py);
#   3. unpacked and checked from the inside with its own Python
#      (tools/verify_build.py);
#   4. updated in place by an older copy of itself, the way a user's copy
#      updates (tools/check_update.py);
# and kept as an artifact for two weeks.
#
# To release: push a tag (git tag v1.2.0 && git push origin v1.2.0), or run
# this workflow from the Actions tab with a version. The release job
# publishes a GitHub release with the four builds and SHA256SUMS only if
# everything above passed; installed copies then offer the update.
name: Build, check and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish a release with this version, such as 1.2.0 (empty: only build and check)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}-${{ inputs.release || github.event_name }}
  # A newer push replaces a running check of main or a pull request; releases always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

env:
  PYTHONUNBUFFERED: '1'

jobs:
  prepare:
    name: Version and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Tags, for the version
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Version
        id: version
        env:
          REQUESTED: ${{ inputs.release }}
        run: |
          if [ -n "$REQUESTED" ]; then
            version="${REQUESTED#v}"
            release=true
            if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
              echo "::error::v$version is already released"; exit 1
            fi
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            release=true
          else
            version="$(python -c 'import sys; sys.path.insert(0, "tools"); import bundle; print(bundle.version())')"
            release=false
          fi
          if [ "$release" = true ] && ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::A release version looks like 1.2.0, not '$version'"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "Retro Pocket $version (release: $release)" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Lint
        run: |
          python -m pip install --disable-pip-version-check -q pyflakes
          python -m pyflakes *.py tools tests

  windows:
    name: Windows (x86_64)
    needs: prepare
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      RETRO_POCKET_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/cache@v6
        with:
          path: build/cache
          key: downloads-windows-${{ hashFiles('tools/install_emulators.py', 'tools/build_windows.py') }}
      - name: Set up from source (setup.cmd)
        shell: cmd
        run: call setup.cmd
      - name: Unit tests
        run: .venv\Scripts\python -m unittest discover -s tests -v
      - name: Build
        run: .venv\Scripts\python tools\build_windows.py
      - name: Check the build from the inside
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'windows-build'
          Expand-Archive dist\Retro-Pocket-Windows.zip -DestinationPath $dir
          $build = Join-Path $dir 'Retro Pocket'
          & "$build\python\python.exe" tools\verify_build.py --app-dir $build --arch x86_64 --network `
            --run-emulators --expect-version $env:RETRO_POCKET_VERSION
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Update an older copy to this build
        run: .venv\Scripts\python tools\check_update.py dist\Retro-Pocket-Windows.zip
      - uses: actions/upload-artifact@v7
        with:
          name: Retro-Pocket-Windows
          path: dist/Retro-Pocket-Windows.zip
          retention-days: 14
          compression-level: 0

  linux:
    name: Linux (x86_64)
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RETRO_POCKET_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Install the distribution's emulators
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv libretro-mgba desmume \
            mupen64plus-ui-console mupen64plus-video-glide64mk2
      - name: Set up from source (setup.sh)
        run: ./setup.sh
      - name: Unit tests
        run: .venv/bin/python -m unittest discover -s tests -v
      - name: Build
        run: .venv/bin/python tools/build_linux.py
      - name: Check the build from the inside
        run: |
          dir="$RUNNER_TEMP/linux-build"
          mkdir -p "$dir"
          tar -xzf dist/Retro-Pocket-Linux.tar.gz -C "$dir"
          build="$dir/retro-pocket"
          "$build/setup.sh"
          # Azahar has no Ubuntu package (it is an AppImage), so the 3DS emulator may be missing here.
          "$build/.venv/bin/python" tools/verify_build.py --app-dir "$build" --arch x86_64 --optional 3ds \
            --network --launcher "$build/RetroPocket.sh" --expect-version "$RETRO_POCKET_VERSION"
      - name: Update an older copy to this build
        run: .venv/bin/python tools/check_update.py dist/Retro-Pocket-Linux.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: Retro-Pocket-Linux
          path: dist/Retro-Pocket-Linux.tar.gz
          retention-days: 14
          compression-level: 0

  macos:
    name: macOS ${{ matrix.label }} (${{ matrix.arch }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      RETRO_POCKET_VERSION: ${{ needs.prepare.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            label: Apple Silicon
            slug: Apple-Silicon
          - runner: macos-15-intel
            arch: x86_64
            label: Intel
            slug: Intel
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: build/cache
          key: downloads-macos-${{ matrix.arch }}-${{ hashFiles('tools/install_emulators.py', 'tools/build_macos.py') }}
      - name: Set up from source (setup.command)
        run: ./setup.command
      - name: Unit tests
        run: .venv/bin/python -m unittest discover -s tests -v
      - name: Build
        run: .venv/bin/python tools/build_macos.py --arch ${{ matrix.arch }}
      - name: Check the app from the inside
        run: |
          dir="$RUNNER_TEMP/macos-build"
          mkdir -p "$dir"
          ditto -x -k "dist/Retro-Pocket-macOS-${{ matrix.slug }}.zip" "$dir"
          app="$dir/Retro Pocket (${{ matrix.label }}).app"
          resources="$app/Contents/Resources"
          PYTHONHOME="$resources/python" PYTHONNOUSERSITE=1 PYTHONDONTWRITEBYTECODE=1 \
          SSL_CERT_FILE="$resources/python/lib/python3.12/site-packages/certifi/cacert.pem" \
            "$app/Contents/MacOS/python3.12" tools/verify_build.py --app-dir "$resources/app" \
            --arch ${{ matrix.arch }} --network --run-emulators --window \
            --launcher "$app/Contents/MacOS/RetroPocket" --expect-version "$RETRO_POCKET_VERSION"
      - name: Update an older copy to this build
        run: .venv/bin/python tools/check_update.py "dist/Retro-Pocket-macOS-${{ matrix.slug }}.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: Retro-Pocket-macOS-${{ matrix.slug }}
          path: dist/Retro-Pocket-macOS-${{ matrix.slug }}.zip
          retention-days: 14
          compression-level: 0

  release:
    name: Publish the release
    needs: [prepare, windows, linux, macos]
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish the four checked builds
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          cd dist
          test "$(ls | wc -l)" -eq 4
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
          cd ..
          # A tag push already made the tag; a release from the Actions tab makes it on this commit.
          gh release create "v$VERSION" dist/* --target "$GITHUB_SHA" --title "Retro Pocket $VERSION" \
            --notes-file .github/release-notes.md --generate-notes
          echo "Published https://github.com/$GITHUB_REPOSITORY/releases/tag/v$VERSION" | tee -a "$GITHUB_STEP_SUMMARY"
